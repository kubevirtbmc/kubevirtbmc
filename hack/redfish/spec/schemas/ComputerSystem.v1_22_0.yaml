components:
  schemas:
    ComputerSystem_v1_22_0_Actions:
      additionalProperties: false
      description: The available actions for this resource.
      properties:
        '#ComputerSystem.AddResourceBlock':
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_AddResourceBlock'
        '#ComputerSystem.Decommission':
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_Decommission'
        '#ComputerSystem.RemoveResourceBlock':
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_RemoveResourceBlock'
        '#ComputerSystem.Reset':
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_Reset'
        '#ComputerSystem.SetDefaultBootOrder':
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_SetDefaultBootOrder'
        Oem:
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_OemActions'
          description: The available OEM-specific actions for this resource.
          x-longDescription: This property shall contain the available OEM-specific actions for this resource.
      type: object
      x-longDescription: This type shall contain the available actions for this resource.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    ComputerSystem_v1_22_0_AddResourceBlock:
      additionalProperties: false
      description: This action adds a resource block to a system.
      properties:
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
        title:
          description: Friendly action name
          type: string
      type: object
      x-longDescription: This action shall add a resource block to a system.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
      x-versionAdded: v1_6_0
    ComputerSystem_v1_22_0_AddResourceBlockRequestBody:
      additionalProperties: false
      description: This action adds a resource block to a system.
      properties:
        ComputerSystemETag:
          description: The current ETag of the system.
          type: string
          x-longDescription: This parameter shall contain the current ETag of the system.  If the client-provided ETag does not match the current ETag of the system, the service shall return the HTTP 428 (Precondition Required) status code to reject the request.
        ResourceBlock:
          allOf:
            - $ref: ./odata-v4.yaml#/components/schemas/odata-v4_idRef
          description: The resource block to add to the system.
          x-longDescription: This parameter shall contain a link to the specified resource block to add to the system.
        ResourceBlockETag:
          description: The current ETag of the resource block to add to the system.
          type: string
          x-longDescription: This parameter shall contain the current ETag of the resource block to add to the system.  If the client-provided ETag does not match the current ETag of the resource block that the ResourceBlock parameter specifies, the service shall return the HTTP 428 (Precondition Required) status code to reject the request.
      required:
        - ResourceBlock
      type: object
      x-longDescription: This action shall add a resource block to a system.
    ComputerSystem_v1_22_0_AutomaticRetryConfig:
      enum:
        - Disabled
        - RetryAttempts
        - RetryAlways
      type: string
      x-enumDescriptions:
        Disabled: Disable automatic retrying of booting.
        RetryAlways: Always automatically retry booting.
        RetryAttempts: Automatic retrying of booting is based on a specified retry count.
      x-enumLongDescriptions:
        Disabled: This value shall indicate that automatic retrying of booting is disabled.
        RetryAlways: This value shall indicate that the system will always automatically retry booting.
        RetryAttempts: This value shall indicate that the number of retries of booting is based on the AutomaticRetryAttempts property, and the RemainingAutomaticRetryAttempts property indicates the number of remaining attempts.
    ComputerSystem_v1_22_0_Boot:
      additionalProperties: false
      description: The boot information for this resource.
      properties:
        AliasBootOrder:
          description: Ordered array of boot source aliases representing the persistent boot order associated with this computer system.
          items:
            $ref: ./ComputerSystem.yaml#/components/schemas/ComputerSystem_BootSource
            nullable: true
          readOnly: false
          type: array
          x-longDescription: This property shall contain an ordered array of boot source aliases of the BootSource type that represents the persistent boot order of this computer system.  This array shall not contain duplicate values.  Virtual devices for an alias should take precedence over a physical device.  Systems may attempt to boot from multiple devices that share an alias.
          x-versionAdded: v1_6_0
        AutomaticRetryAttempts:
          description: The number of attempts the system will automatically retry booting.
          format: int64
          minimum: 0
          nullable: true
          readOnly: false
          type: integer
          x-longDescription: This property shall contain the number of attempts the system will automatically retry booting in the event the system enters an error state on boot.
          x-versionAdded: v1_11_0
        AutomaticRetryConfig:
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_AutomaticRetryConfig'
          description: The configuration of how the system retries booting automatically.
          nullable: true
          readOnly: false
          x-longDescription: This property shall contain the configuration of how the system retries booting automatically.
          x-versionAdded: v1_11_0
        BootNext:
          description: The BootOptionReference of the Boot Option to perform a one-time boot from when BootSourceOverrideTarget is `UefiBootNext`.
          nullable: true
          readOnly: false
          type: string
          x-longDescription: This property shall contain the BootOptionReference of the UEFI boot option for one time boot, as defined by the UEFI Specification.  The valid values for this property are specified in the values of the BootOrder array.  BootSourceOverrideEnabled set to `Continuous` is not supported for BootSourceOverrideTarget set to `UefiBootNext` because this setting is defined in UEFI as a one-time boot setting.
          x-versionAdded: v1_5_0
        BootOptions:
          $ref: ./odata-v4.yaml#/components/schemas/odata-v4_idRef
          description: The link to the collection of the UEFI boot options associated with this computer system.
          readOnly: true
          x-longDescription: This property shall contain a link to a resource collection of type BootOptionCollection.
          x-versionAdded: v1_5_0
        BootOrder:
          description: An array of BootOptionReference strings that represent the persistent boot order for with this computer system.  Changes to the boot order typically require a system reset before they take effect.  It is likely that a client finds the `@Redfish.Settings` term in this resource, and if it is found, the client makes requests to change boot order settings by modifying the resource identified by the `@Redfish.Settings` term.
          items:
            nullable: true
            type: string
          readOnly: false
          type: array
          x-longDescription: This property shall contain an array of BootOptionReference strings that represent the persistent boot order for this computer system.  For UEFI systems, this is the UEFI Specification-defined UEFI BootOrder.
          x-versionAdded: v1_5_0
        BootOrderPropertySelection:
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_BootOrderTypes'
          description: The name of the boot order property that the system uses for the persistent boot order.
          nullable: true
          readOnly: false
          x-longDescription: This property shall indicate which boot order property the system uses for the persistent boot order.
          x-versionAdded: v1_6_0
        BootSourceOverrideEnabled:
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_BootSourceOverrideEnabled'
          description: The state of the boot source override feature.
          nullable: true
          readOnly: false
          x-longDescription: This property shall contain `Once` for a one-time boot override, and `Continuous` for a remain-active-until-cancelled override.  If set to `Once`, the value is reset to `Disabled` after the BootSourceOverrideTarget actions have completed successfully.  Changes to this property do not alter the BIOS persistent boot order configuration.
        BootSourceOverrideMode:
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_BootSourceOverrideMode'
          description: The BIOS boot mode to use when the system boots from the BootSourceOverrideTarget boot source.
          nullable: true
          readOnly: false
          x-longDescription: This property shall contain the BIOS boot mode to use when the system boots from the BootSourceOverrideTarget boot source.
          x-versionAdded: v1_1_0
        BootSourceOverrideTarget:
          $ref: ./ComputerSystem.yaml#/components/schemas/ComputerSystem_BootSource
          description: The current boot source to use at the next boot instead of the normal boot device, if BootSourceOverrideEnabled does not contain `Disabled`.
          nullable: true
          readOnly: false
          x-longDescription: This property shall contain the source to boot the system from, overriding the normal boot order.  The @Redfish.AllowableValues annotation specifies the valid values for this property.  `UefiTarget` indicates to boot from the UEFI device path found in UefiTargetBootSourceOverride.  `UefiBootNext` indicates to boot from the UEFI BootOptionReference found in BootNext.  Virtual devices for a target should take precedence over a physical device.  Systems may attempt to boot from multiple devices that share a target identifier.  Changes to this property do not alter the BIOS persistent boot order configuration.
        Certificates:
          $ref: ./odata-v4.yaml#/components/schemas/odata-v4_idRef
          description: The link to a collection of certificates used for booting through HTTPS by this computer system.
          readOnly: true
          x-longDescription: This property shall contain a link to a resource collection of type CertificateCollection.
          x-versionAdded: v1_7_0
        HttpBootUri:
          description: The URI to boot from when BootSourceOverrideTarget is set to `UefiHttp`.
          format: uri-reference
          nullable: true
          readOnly: false
          type: string
          x-longDescription: This property shall contain the URI to perform an HTTP or HTTPS boot when BootSourceOverrideTarget is set to `UefiHttp`.  If this property is not configured or supported, the URI shall be provided by a DHCP server as specified by the UEFI Specification.
          x-versionAdded: v1_9_0
        RemainingAutomaticRetryAttempts:
          description: The number of remaining automatic retry boots.
          format: int64
          minimum: 0
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property shall contain the number of attempts remaining the system will retry booting in the event the system enters an error state on boot.  If `0`, the system has no remaining automatic boot retry attempts and shall not automatically retry booting if the system enters an error state.  This property shall be reset to the value of AutomaticRetryAttempts upon a successful boot attempt.
          x-versionAdded: v1_11_0
        StopBootOnFault:
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_StopBootOnFault'
          description: If the boot should stop on a fault.
          nullable: true
          readOnly: false
          x-longDescription: This property shall contain the setting if the boot should stop on a fault.
          x-versionAdded: v1_15_0
        TrustedModuleRequiredToBoot:
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_TrustedModuleRequiredToBoot'
          description: The Trusted Module boot requirement.
          nullable: true
          readOnly: false
          x-longDescription: This property shall contain the Trusted Module boot requirement.
          x-versionAdded: v1_14_0
        UefiTargetBootSourceOverride:
          description: The UEFI device path of the device from which to boot when BootSourceOverrideTarget is `UefiTarget`.
          nullable: true
          readOnly: false
          type: string
          x-longDescription: This property shall contain the UEFI device path of the override boot target.  Changes to this property do not alter the BIOS persistent boot order configuration.
      type: object
      x-longDescription: This type shall contain properties that describe boot information for a system.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    ComputerSystem_v1_22_0_BootOrderTypes:
      description: The enumerations of BootOrderTypes specify the choice of boot order property to use when controller the persistent boot order for this computer system.
      enum:
        - BootOrder
        - AliasBootOrder
      type: string
      x-enumDescriptions:
        AliasBootOrder: The system uses the AliasBootOrder property to specify the persistent boot order.
        BootOrder: The system uses the BootOrder property to specify the persistent boot order.
    ComputerSystem_v1_22_0_BootProgress:
      additionalProperties: false
      description: This object describes the last boot progress state.
      properties:
        LastBootTimeSeconds:
          description: The number of seconds the system spent booting to the operating system during the last boot.
          nullable: true
          readOnly: true
          type: number
          x-longDescription: This property shall contain the number of seconds that elapsed between system reset or power on and LastState transitioning to `OSRunning`.  If LastState contains `OSRunning`, this property shall contain the most recent boot time.  For other values of LastState, this property shall contain the boot time for the previous boot.
          x-versionAdded: v1_18_0
        LastState:
          $ref: '#/components/schemas/ComputerSystem_v1_22_0_BootProgressTypes'
          description: The last boot progress state.
          nullable: true
          readOnly: true
          x-longDescription: This property shall contain the last boot progress state.
          x-versionAdded: v1_13_0
        LastStateTime:
          description: The date and time when the last boot state was updated.
          format: date-time
          nullable: true
          readOnly: true
          type: string
          x-longDescription: This property shall contain the date and time when the last boot state was updated.
          x-versionAdded: v1_13_0
        Oem:
          $ref: ./Resource.yaml#/components/schemas/Resource_Oem
          description: The OEM extension property.
          x-longDescription: This property shall contain the OEM extensions.  All values for properties contained in this object shall conform to the Redfish Specification-described requirements.
          x-versionAdded: v1_13_0
        OemLastState:
          description: The OEM-specific last state, if the LastState type is `OEM`.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: This property shall represent the OEM-specific LastState of the BootProgress.  This property shall only be present if LastState is `OEM`.
          x-versionAdded: v1_13_0
      type: object
      x-longDescription: This object shall contain the last boot progress state and time.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    ComputerSystem_v1_22_0_BootProgressTypes:
      enum:
        - None
        - PrimaryProcessorInitializationStarted
        - BusInitializationStarted
        - MemoryInitializationStarted
        - SecondaryProcessorInitializationStarted
        - PCIResourceConfigStarted
        - SystemHardwareInitializationComplete
        - SetupEntered
        - OSBootStarted
        - OSRunning
        - OEM
      type: string
      x-enumDescriptions:
        BusInitializationStarted: The system has started initializing the buses.
        MemoryInitializationStarted: The system has started initializing the memory.
        None: The system is not booting.
        OEM: A boot progress state in an OEM-defined format.
        OSBootStarted: The operating system has started booting.
        OSRunning: The operating system is running.
        PCIResourceConfigStarted: The system has started initializing the PCI resources.
        PrimaryProcessorInitializationStarted: The system has started initializing the primary processor.
        SecondaryProcessorInitializationStarted: The system has started initializing the remaining processors.
        SetupEntered: The system has entered the setup utility.
        SystemHardwareInitializationComplete: The system has completed initializing all hardware.
      x-enumLongDescriptions:
        BusInitializationStarted: This value shall indicate that the system has started to initialize the buses.
        MemoryInitializationStarted: This value shall indicate that the system has started to initialize the memory.
        None: This value shall indicate that the system is not booting or running, such as the system is powered off.
        OEM: This value shall indicate an OEM-defined boot progress state.
        OSBootStarted: This value shall indicate that the operating system has started to boot.
        OSRunning: This value shall indicate that the operating system is running and shall indicate the final boot progress state.
        PCIResourceConfigStarted: This value shall indicate that the system has started to initialize the PCI resources.
        PrimaryProcessorInitializationStarted: This value shall indicate that the system has started to initialize the primary processor.
        SecondaryProcessorInitializationStarted: This value shall indicate that the system has started to initialize the secondary processors.
        SetupEntered: This value shall indicate that the system has entered the setup utility.
        SystemHardwareInitializationComplete: This value shall indicate that the system has completed initializing all hardware.
      x-enumVersionAdded:
        SetupEntered: v1_15_0
    ComputerSystem_v1_22_0_BootSourceOverrideEnabled:
      enum:
        - Disabled
        - Once
        - Continuous
      type: string
      x-enumDescriptions:
        Continuous: The system boots to the target specified in the BootSourceOverrideTarget property until this property is `Disabled`.
        Disabled: The system boots normally.
        Once: On its next boot cycle, the system boots one time to the boot source override target.  Then, the BootSourceOverrideEnabled value is reset to `Disabled`.
    ComputerSystem_v1_22_0_BootSourceOverrideMode:
      enum:
        - Legacy
        - UEFI
      type: string
      x-enumDescriptions:
        Legacy: The system boots in non-UEFI boot mode to the boot source override target.
        UEFI: The system boots in UEFI boot mode to the boot source override target.
    ComputerSystem_v1_22_0_Composition:
      additionalProperties: false
      description: Information about the composition capabilities and state of a computer system.
      properties:
        UseCases:
          description: The composition use cases in which this computer system can participate.
          items:
            $ref: '#/components/schemas/ComputerSystem_v1_22_0_CompositionUseCase'
            nullable: true
          readOnly: true
          type: array
          x-longDescription: This property shall contain the composition use cases in which this computer system can participate.
          x-versionAdded: v1_18_0
      type: object
      x-longDescription: This type shall contain information about the composition capabilities and state of a computer system.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    ComputerSystem_v1_22_0_CompositionUseCase:
      enum:
        - ResourceBlockCapable
        - ExpandableSystem
      type: string
      x-enumDescriptions:
        ExpandableSystem: This computer system supports expandable system composition and is associated with a resource block.
        ResourceBlockCapable: This computer system supports being registered as a resource block in order for it to participate in composition requests.
      x-enumLongDescriptions:
        ExpandableSystem: This value shall indicate the computer system supports expandable system composition and is associated with a resource block.
        ResourceBlockCapable: This value shall indicate the computer system supports being registered as a resource block in order for it to participate in composition requests.
    ComputerSystem_v1_22_0_ComputerSystem:
