components:
  schemas:
    Message_v1_2_0_Message:
      additionalProperties: false
      description: The message that the Redfish service returns.
      properties:
        Message:
          description: The human-readable message.
          readOnly: true
          type: string
          x-longDescription: This property shall contain a human-readable message.
        MessageArgs:
          description: An array of message arguments that are substituted for the arguments in the message when looked up in the message registry.
          items:
            type: string
          readOnly: true
          type: array
          x-longDescription: This property shall contain an array of message arguments that are substituted for the arguments in the message when looked up in the message registry.  It has the same semantics as the MessageArgs property in the Redfish MessageRegistry schema.  If the corresponding ParamType value contains `number`, the service shall convert the number to a string representation of the number.
        MessageId:
          description: The identifier for the message.
          readOnly: true
          type: string
          x-longDescription: This property shall contain a MessageId, as defined in the 'MessageId format' clause of the Redfish Specification.
        MessageSeverity:
          $ref: ./Resource.yaml#/components/schemas/Resource_Health
          description: The severity of the message.
          readOnly: true
          x-longDescription: This property shall contain the severity of the message.  Services can replace the value defined in the message registry with a value more applicable to the implementation.
          x-versionAdded: v1_1_0
        Oem:
          $ref: ./Resource.yaml#/components/schemas/Resource_Oem
          description: The OEM extension property.
          x-longDescription: This property shall contain the OEM extensions.  All values for properties contained in this object shall conform to the Redfish Specification-described requirements.
        RelatedProperties:
          description: A set of properties described by the message.
          items:
            type: string
          readOnly: true
          type: array
          x-longDescription: This property shall contain an array of RFC6901-defined JSON pointers indicating the properties described by the message, if appropriate for the message.
        Resolution:
          description: Used to provide suggestions on how to resolve the situation that caused the message.
          readOnly: true
          type: string
          x-longDescription: This property shall contain the resolution of the message.  Services can replace the resolution defined in the message registry with a more specific resolution in message payloads.
        ResolutionSteps:
          description: The list of recommended steps to resolve the situation that caused the message.
          items:
            $ref: ./ResolutionStep.yaml#/components/schemas/ResolutionStep_ResolutionStep
          type: array
          x-longDescription: This property shall contain an array of recommended steps to resolve the situation that caused the message.  This property shall not be present if the MessageSeverity or Severity properties contain `OK`.
          x-versionAdded: v1_2_0
        Severity:
          deprecated: true
          description: The severity of the message.
          readOnly: true
          type: string
          x-deprecatedReason: This property has been deprecated in favor of MessageSeverity, which ties the values to the enumerations defined for the Health property within Status.
          x-longDescription: This property shall contain the severity of the message, as defined in the 'Status' clause of the Redfish Specification.  Services can replace the value defined in the message registry with a value more applicable to the implementation.
          x-versionDeprecated: v1_1_0
      required:
        - MessageId
      type: object
      x-longDescription: This type shall contain a message that the Redfish service returns, as described in the Redfish Specification.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
title: '#Message.v1_2_0'
