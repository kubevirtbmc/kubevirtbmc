components:
  schemas:
    RedfishError:
      description: The error payload from a Redfish service.
      example:
        error:
          '@Message.ExtendedInfo':
          - Message: Message
            MessageArgs:
            - MessageArgs
            - MessageArgs
            MessageId: MessageId
            MessageSeverity: OK
            Oem:
              key: ""
            RelatedProperties:
            - RelatedProperties
            - RelatedProperties
            Resolution: Resolution
            ResolutionSteps:
            - null
            - null
            Severity: Severity
          - Message: Message
            MessageArgs:
            - MessageArgs
            - MessageArgs
            MessageId: MessageId
            MessageSeverity: OK
            Oem:
              key: ""
            RelatedProperties:
            - RelatedProperties
            - RelatedProperties
            Resolution: Resolution
            ResolutionSteps:
            - null
            - null
            Severity: Severity
          code: code
          message: message
      properties:
        error:
          $ref: "#/components/schemas/RedfishError_error"
      required:
      - error
      type: object
      x-longDescription: The Redfish Specification-described type shall contain an
        error payload from a Redfish service.
    ServiceRoot_v1_16_1_ServiceRoot:
      additionalProperties: false
      description: "The ServiceRoot schema describes the root of the Redfish service,\
        \ located at the '/redfish/v1' URI.  All other resources accessible through\
        \ the Redfish interface on this device are linked directly or indirectly from\
        \ the service root."
      example:
        '@odata.context': '@odata.context'
        '@odata.etag': '@odata.etag'
        '@odata.id': '@odata.id'
        '@odata.type': '@odata.type'
        AccountService:
          '@odata.id': '@odata.id'
        AggregationService:
          '@odata.id': '@odata.id'
        Cables:
          '@odata.id': '@odata.id'
        CertificateService:
          '@odata.id': '@odata.id'
        Chassis:
          '@odata.id': '@odata.id'
        ComponentIntegrity:
          '@odata.id': '@odata.id'
        CompositionService:
          '@odata.id': '@odata.id'
        Description: Description
        EventService:
          '@odata.id': '@odata.id'
        Fabrics:
          '@odata.id': '@odata.id'
        Facilities:
          '@odata.id': '@odata.id'
        Id: ""
        JobService:
          '@odata.id': '@odata.id'
        JsonSchemas:
          '@odata.id': '@odata.id'
        KeyService:
          '@odata.id': '@odata.id'
        LicenseService:
