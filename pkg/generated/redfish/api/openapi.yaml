            DeepPOST: true
            MaxLevels: 1
          ExcerptQuery: true
          ExpandQuery:
            ExpandAll: true
            Levels: true
            Links: true
            MaxLevels: 1
            NoLinks: true
          FilterQuery: true
          MultipleHTTPRequests: true
          OnlyMemberQuery: true
          SelectQuery: true
        RedfishVersion: RedfishVersion
        RegisteredClients:
          '@odata.id': '@odata.id'
        Registries:
          '@odata.id': '@odata.id'
        ResourceBlocks:
          '@odata.id': '@odata.id'
        ServiceConditions:
          '@odata.id': '@odata.id'
        ServiceIdentification: ServiceIdentification
        SessionService:
