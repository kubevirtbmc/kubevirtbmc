        ProtocolFeaturesSupported:
          $ref: "#/components/schemas/ServiceRoot_v1_16_1_ProtocolFeaturesSupported"
        RedfishVersion:
          description: The version of the Redfish service.
          pattern: ^\d+\.\d+\.\d+$
