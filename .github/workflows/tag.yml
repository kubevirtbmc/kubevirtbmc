name: Tag Build and Publish

on:
  push:
    tags:
    - "v*"

jobs:
  build-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REPO: kubevirtbmc
      MANAGER: virtbmc-controller
      AGENT: virtbmc
      VERSION: ${{ github.ref_name }}
      GIT_COMMIT: ${{ github.sha }}
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ matrix.image }}
    - name: Docker build and push manager
      uses: docker/build-push-action@v6
      with:
        provenance: false
        context: .
        build-args: |
          LINKFLAGS=-X main.AppVersion=${{ env.VERSION }} -X main.GitCommit=${{ env.GIT_COMMIT }}
        platforms: linux/amd64,linux/arm64
        file: Dockerfile
        push: true
        tags: ${{ env.REPO }}/${{ env.MANAGER }}:${{ env.VERSION }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Docker build and push agent
      uses: docker/build-push-action@v6
      with:
        provenance: false
        context: .
        build-args: |
          LINKFLAGS=-X main.AppVersion=${{ env.VERSION }} -X main.GitCommit=${{ env.GIT_COMMIT }}
        platforms: linux/amd64,linux/arm64
        file: Dockerfile.virtbmc
        push: true
        tags: ${{ env.REPO }}/${{ env.AGENT }}:${{ env.VERSION }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Generate install manifest YAML
      run: |
        make generate-install-manifest IMG=${{ env.REPO }}/${{ env.MANAGER }}:${{ env.VERSION }}

    # Static agent binaries (CGO disabled, stripped) for running virtbmc in
    # standalone mode without pulling the container image.
    - name: Build static agent binaries
      run: |
        for arch in amd64 arm64; do
          CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
            -ldflags "-s -w -X main.AppVersion=${{ env.VERSION }} -X main.GitCommit=${{ env.GIT_COMMIT }}" \
            -o virtbmc-linux-$arch cmd/virtbmc/main.go
        done
        sha256sum virtbmc-linux-amd64 virtbmc-linux-arm64 > virtbmc-checksums.txt

    - name: Create Release and upload install manifest
      uses: softprops/action-gh-release@v2
      with:
        files: |
          kubevirtbmc-install.yaml
          virtbmc-linux-amd64
          virtbmc-linux-arm64
          virtbmc-checksums.txt
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
