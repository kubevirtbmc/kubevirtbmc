name: Pull Request Build

on:
  pull_request:
    types:
    - opened
    - synchronize

jobs:
  build-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REPO: kubevirtbmc
      MANAGER: virtbmc-controller
      AGENT: virtbmc
      VERSION: pr-${{ github.event.number }}-head
      GIT_COMMIT: ${{ github.sha }}
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ matrix.image }}
    - name: Verify generated files are up-to-date
      run: |
        make manifests generate generate-kubevirt-crd
        if ! git diff --exit-code; then
          echo "Generated files are out of sync!"
          echo "Please run 'make manifests generate generate-kubevirt-crd' locally and commit changes"
          exit 1
        fi
    - name: Lint
      run: make lint
    - name: Run tests
      run: make test
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: kubevirtbmc/kubevirtbmc
        files: ./cover.out
    - name: Build binaries
      run: make build
    # The docker daemon does not support tags pointing at a manifest list, rather than a manifest. Ref: https://github.com/docker/buildx/issues/59
    # Images built in this pipeline are meant to be used for the end-to-end testing, so it's tolerable to build the images for single platform.
    - name: Docker build manager
      uses: docker/build-push-action@v6
      with:
        provenance: false
        context: .
        build-args: |
          LINKFLAGS=-X main.AppVersion=${{ env.VERSION }} -X main.GitCommit=${{ env.GIT_COMMIT }}
        file: Dockerfile
        push: false
        load: true
        tags: ${{ env.REPO }}/${{ env.MANAGER }}:${{ env.VERSION }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Docker build agent
      uses: docker/build-push-action@v6
      with:
        provenance: false
        context: .
        build-args: |
          LINKFLAGS=-X main.AppVersion=${{ env.VERSION }} -X main.GitCommit=${{ env.GIT_COMMIT }}
        file: Dockerfile.virtbmc
        push: false
        load: true
        tags: ${{ env.REPO }}/${{ env.AGENT }}:${{ env.VERSION }}
        labels: ${{ steps.meta.outputs.labels }}
    # Hand the freshly built images to the e2e jobs as artifacts: every job
    # runs on a fresh runner with an empty docker store.
    - name: Export e2e images
      run: |
        docker save -o ${{ runner.temp }}/manager-image.tar ${{ env.REPO }}/${{ env.MANAGER }}:${{ env.VERSION }}
        docker save -o ${{ runner.temp }}/agent-image.tar ${{ env.REPO }}/${{ env.AGENT }}:${{ env.VERSION }}
    - name: Upload e2e images
      uses: actions/upload-artifact@v4
      with:
        name: e2e-images
        path: |
          ${{ runner.temp }}/manager-image.tar
          ${{ runner.temp }}/agent-image.tar
        retention-days: 1
        if-no-files-found: error

  e2e-managed:
    needs: build-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REPO: kubevirtbmc
      VERSION: pr-${{ github.event.number }}-head
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Download e2e images
      uses: actions/download-artifact@v4
      with:
        name: e2e-images
        path: ${{ runner.temp }}
    - name: Load images into docker
      run: |
        docker load -i ${{ runner.temp }}/manager-image.tar
        docker load -i ${{ runner.temp }}/agent-image.tar
    - name: Run managed end-to-end testing
      run: make e2e-setup e2e-test e2e-teardown

  # Standalone needs only the agent image and none of the
  # cert-manager/CRD/controller setup, so it gets its own leg: a failure here
  # reruns without the managed suite and vice versa.
  e2e-standalone:
    needs: build-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REPO: kubevirtbmc
      VERSION: pr-${{ github.event.number }}-head
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Download e2e images
      uses: actions/download-artifact@v4
      with:
        name: e2e-images
        path: ${{ runner.temp }}
    - name: Load images into docker
      run: docker load -i ${{ runner.temp }}/agent-image.tar
    - name: Run standalone end-to-end testing
      run: make e2e-setup e2e-test-standalone e2e-teardown
