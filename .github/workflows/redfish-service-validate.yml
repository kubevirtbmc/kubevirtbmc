name: Redfish Service Validator

# Runs the DMTF Redfish-Service-Validator against the Redfish API served by
# hack/redfish/interopserver (the real VirtualMachineResourceManager on
# in-memory fake clients — no cluster, no KubeVirt). Unlike the interop
# workflow (Ironic profile conformance), this validates every reachable
# resource against the DMTF CSDL schemas from the local DSP8010 bundle
# (make download-redfish-schema), catching schema-level violations the
# profile never checks: phantom empty objects, missing required properties,
# dangling navigation links.
# On PRs the base ref is validated too, and the step summary diffs the two
# runs: regressions introduced vs. failures fixed by the PR.
# Gating: the job fails when the PR introduces NEW failures vs. the base run
# (--fail-on-introduced). Without a base run (workflow_dispatch, or a base
# ref predating the tooling) the report is informational only.
# Local equivalent: make redfish-service-validate.

on:
  pull_request:
    paths:
      - "pkg/redfish/**"
      - "pkg/resourcemanager/**"
      - "pkg/generated/redfish/**"
      - "pkg/session/**"
      - "hack/redfish/**"
      - ".github/workflows/redfish-service-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redfish-service-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  VALIDATOR_VERSION: "3.1.7"

jobs:
  service-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # On pull_request events this is the synthetic merge commit, i.e. the
      # post-merge result.
      - name: Check out PR head
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Redfish-Service-Validator
        run: pip install "redfish_service_validator==${{ env.VALIDATOR_VERSION }}"

      - name: Validate PR head
        env:
          LOGDIR: logs/head
          # A failed validation must not fail this step: the base run and the
          # Report gate come after. Build/readiness failures still fail it.
          EXIT_WITH_VALIDATOR: "0"
        run: hack/redfish/run-service-validate.sh

      - name: Check out base ref
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Validate base ref
        if: github.event_name == 'pull_request'
        env:
          # Absolute path: the script cds into base/.
          LOGDIR: ${{ github.workspace }}/logs/base
          EXIT_WITH_VALIDATOR: "0"
        run: |
          # Base refs from before this tooling existed can't be compared.
          if [ ! -x base/hack/redfish/run-service-validate.sh ]; then
            echo "Base ref has no hack/redfish/run-service-validate.sh; skipping base run."
            exit 0
          fi
          base/hack/redfish/run-service-validate.sh

      - name: Report
        # pipefail: the default `bash -e` would let tee swallow the diff's
        # exit code and the regression gate would never fail the step.
        shell: bash -eo pipefail {0}
        # tee: also keep the report in the step log — a bare "exit code 1"
        # with the detail only on the Job Summary page reads like an
        # infrastructure error, not a gate decision.
        run: |
          if [ -d logs/base ]; then
            python3 hack/redfish/service-diff.py --fail-on-introduced logs/head logs/base | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 hack/redfish/service-diff.py logs/head | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validator logs
        # always(): artifacts matter most when earlier steps fail — a gate
        # failure (new regressions) or an infra failure in a validate step is
        # exactly when the full validator logs are needed for diagnosis.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redfish-service-validator-logs
          path: logs/
          retention-days: 14
